name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Deliberately NOT run in CI: test:e2e talks to a live Monad network,
      # so it is slow, needs a reachable RPC endpoint, and can flake for
      # reasons unrelated to the code. Run it manually: npm run test:e2e
      # - name: End-to-end tests (manual only)
      #   run: npm run test:e2e

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build
